<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eefc;background:#0d131d;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 82% 30%,var(--c) 0,transparent 70%);opacity:.38}
.wrap{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.chip{align-self:flex-start;padding:8px 18px;border-radius:999px;border:2px solid var(--c);color:var(--c);font-size:26px;font-weight:600}
h1{font-size:112px;line-height:1.02;font-weight:800;letter-spacing:-2px;max-width:820px}
p{font-size:36px;line-height:1.3;color:#b9c6e0;max-width:800px;margin-top:22px}
.glyph{position:absolute;right:84px;top:90px;width:300px;height:300px;border-radius:64px;display:grid;place-content:center;font-size:190px;color:#0d131d;background:var(--c)}
.foot{font-size:30px;color:#8fa0c4;font-weight:600}
</style></head><body>
<div class="glow"></div><div class="glyph" id="g"></div>
<div class="wrap"><span class="chip" id="cat"></span><div><h1 id="t"></h1><p id="d"></p></div><div class="foot">GoVibeArcade · free, no ads, no sign-up</div></div>
<script>
const q=new URLSearchParams(location.search)
const hue={Puzzle:'#b48cff',Focus:'#5fd4ff',Arcade:'#ff8fa8',Logic:'#7ee0b5',Strategy:'#ffc86b',Word:'#9fe36a',Retro:'#ffa35c',Cards:'#ff9aa2'}
document.documentElement.style.setProperty('--c',hue[q.get('c')]||'#8fb4ff')
t.textContent=q.get('t');d.textContent=q.get('d');cat.textContent=q.get('c');g.textContent=q.get('g')
</script></body></html>
